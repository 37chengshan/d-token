[package]
name = "d-token-desktop"
version = "0.2.0"
description = "d-token desktop control plane"
authors = ["d-token contributors"]
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dtoken-core-api = { path = "../../../crates/dtoken-core-api" }
dtoken-config-patcher = { path = "../../../crates/dtoken-config-patcher" }
dtoken-event-ledger = { path = "../../../crates/dtoken-event-ledger" }
dtoken-project-policy = { path = "../../../crates/dtoken-project-policy" }
dtoken-process = { path = "../../../crates/dtoken-process" }
dtoken-types = { path = "../../../crates/dtoken-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
