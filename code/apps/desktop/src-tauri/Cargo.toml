[package]
name = "d-token-desktop"
version.workspace = true
description = "d-token desktop control plane"
authors = ["d-token contributors"]
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
dtoken-agent-bridge = { path = "../../../crates/dtoken-agent-bridge" }
dtoken-codebase-memory = { path = "../../../crates/dtoken-codebase-memory" }
dtoken-compress = { path = "../../../crates/dtoken-compress" }
dtoken-core-api = { path = "../../../crates/dtoken-core-api" }
dtoken-config = { path = "../../../crates/dtoken-config" }
dtoken-config-patcher = { path = "../../../crates/dtoken-config-patcher" }
dtoken-context-store = { path = "../../../crates/dtoken-context-store" }
dtoken-event-ledger = { path = "../../../crates/dtoken-event-ledger" }
dtoken-doctor = { path = "../../../crates/dtoken-doctor" }
dtoken-project-policy = { path = "../../../crates/dtoken-project-policy" }
dtoken-learning = { path = "../../../crates/dtoken-learning" }
dtoken-preprocessor = { path = "../../../crates/dtoken-preprocessor" }
dtoken-process = { path = "../../../crates/dtoken-process" }
dtoken-types = { path = "../../../crates/dtoken-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5.workspace = true
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"

# Type-safe Tauri IPC via tauri-specta.
# Pin all three specta crates to avoid build breaks across versions.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
notify = "6.1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
window-vibrancy = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
