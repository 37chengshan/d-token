<!-- ============================================================
     页面：首次引导向导 (Onboarding Wizard)
     ============================================================ -->
<div class="onboarding-page max-w-2xl mx-auto space-y-6 py-4">
  <!-- 向导头部 -->
  <div class="text-center space-y-2">
    <div class="inline-flex size-14 items-center justify-center rounded-2xl bg-orange-500/10 text-orange-500 border border-orange-500/20 shadow-sm mx-auto">
      <svg class="size-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.58-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/></svg>
    </div>
    <h2 class="text-xl font-bold text-foreground">欢迎使用 d-token</h2>
    <p class="text-xs text-muted-foreground max-w-md mx-auto">
      面向 AI Coding 的本地优先桌面控制面。统一接管本地编码 Agent 流量，智能削减冗余 Token 开销，加速大模型响应。
    </p>
  </div>

  <!-- 步骤指示器 (StepProgress) -->
  <div class="flex items-center justify-between border-y border-border/50 py-3 px-4 text-xs">
    <div class="flex items-center gap-2 text-orange-500 font-semibold">
      <span class="flex size-5 items-center justify-center rounded-full bg-orange-500 text-white text-[11px]">1</span>
      <span>环境检测</span>
    </div>
    <div class="h-0.5 flex-1 bg-orange-500/40 mx-3"></div>
    <div class="flex items-center gap-2 text-foreground font-medium">
      <span class="flex size-5 items-center justify-center rounded-full bg-secondary text-foreground text-[11px]">2</span>
      <span>发现 Agent</span>
    </div>
    <div class="h-0.5 flex-1 bg-border mx-3"></div>
    <div class="flex items-center gap-2 text-muted-foreground">
      <span class="flex size-5 items-center justify-center rounded-full bg-secondary text-muted-foreground text-[11px]">3</span>
      <span>一键配置完成</span>
    </div>
  </div>

  <!-- 向导主体卡片 -->
  <div class="rounded-xl border border-border/70 bg-card p-6 shadow-sm space-y-4">
    <div class="flex items-center justify-between">
      <h3 class="text-sm font-semibold text-foreground">本地核心服务就绪</h3>
      <span class="rounded-full bg-emerald-500/15 px-2 py-0.5 text-xs text-emerald-400 font-medium">已启动</span>
    </div>
    <div class="space-y-2 text-xs text-muted-foreground">
      <div class="flex justify-between py-1.5 border-b border-border/30">
        <span>监听地址与端口:</span>
        <span class="font-mono text-foreground font-medium">127.0.0.1:18001 (本地安全环回)</span>
      </div>
      <div class="flex justify-between py-1.5 border-b border-border/30">
        <span>系统凭据库:</span>
        <span class="text-foreground">macOS Keychain (受保护)</span>
      </div>
      <div class="flex justify-between py-1.5">
        <span>扫描到已安装 Coding Agent:</span>
        <span class="text-emerald-400 font-medium">OpenCode, Claude Code, Cursor</span>
      </div>
    </div>

    <!-- 授权与下一步按钮 -->
    <div class="pt-4 flex items-center justify-between border-t border-border/40">
      <button class="text-xs text-muted-foreground hover:text-foreground" data-close-modal="modal-onboarding">
        稍后配置
      </button>
      <button class="rounded-lg bg-orange-600 px-5 py-2 text-xs font-semibold text-white shadow hover:bg-orange-500" data-close-modal="modal-onboarding" onclick="dtokenShowcase.setPage('install')">
        开始一键自动配置 (进入工作台)
      </button>
    </div>
  </div>
</div>
