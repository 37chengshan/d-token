<!-- ============================================================
     页面：系统托盘面板 (Tray Panel Window - 360px 紧凑浮窗)
     ============================================================ -->
<div class="tray-window-container mx-auto p-4 space-y-4">
  <!-- 头部：标题与服务启停开关 -->
  <div class="flex items-center justify-between border-b border-border/50 pb-3">
    <div class="flex items-center gap-2">
      <div class="size-6 rounded bg-orange-500 flex items-center justify-center text-white font-bold text-xs">d</div>
      <span class="font-semibold text-xs text-foreground">d-token 托盘监视</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="size-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-[11px] text-emerald-400 font-medium">代理中</span>
    </div>
  </div>

  <!-- 今日指标简要 -->
  <div class="grid grid-cols-2 gap-2 text-center">
    <div class="rounded-lg bg-secondary/40 p-2.5 border border-border/40">
      <div class="text-[11px] text-muted-foreground">今日节省</div>
      <div class="text-base font-bold text-foreground mt-0.5">124k</div>
      <div class="text-[10px] text-emerald-400">Tokens (-38.4%)</div>
    </div>
    <div class="rounded-lg bg-secondary/40 p-2.5 border border-border/40">
      <div class="text-[11px] text-muted-foreground">代理请求</div>
      <div class="text-base font-bold text-foreground mt-0.5">328 次</div>
      <div class="text-[10px] text-sky-400">平均 2.8ms 延迟</div>
    </div>
  </div>

  <!-- 上游状态与 Agent -->
  <div class="space-y-2 text-xs">
    <div class="flex justify-between items-center py-1 border-b border-border/30">
      <span class="text-muted-foreground">已连接 Agent:</span>
      <span class="text-foreground font-medium">OpenCode, Claude Code</span>
    </div>
    <div class="flex justify-between items-center py-1 border-b border-border/30">
      <span class="text-muted-foreground">上游 DeepSeek:</span>
      <span class="text-emerald-400 font-mono text-[11px]">正常 (89ms)</span>
    </div>
    <div class="flex justify-between items-center py-1">
      <span class="text-muted-foreground">上游 Anthropic:</span>
      <span class="text-emerald-400 font-mono text-[11px]">正常 (142ms)</span>
    </div>
  </div>

  <!-- 底部快捷操作 -->
  <div class="grid grid-cols-2 gap-2 pt-2 border-t border-border/50">
    <button class="w-full rounded-md bg-orange-600 py-1.5 text-xs font-medium text-white hover:bg-orange-500" data-close-modal="modal-tray" onclick="dtokenShowcase.setPage('overview')">
      打开控制面板
    </button>
    <button class="w-full rounded-md border border-border bg-secondary/60 py-1.5 text-xs font-medium text-foreground hover:bg-secondary" data-close-modal="modal-tray" onclick="dtokenShowcase.setPage('doctor')">
      运行诊断
    </button>
  </div>
</div>
