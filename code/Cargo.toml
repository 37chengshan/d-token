[workspace]
members = [
  "crates/dtoken-types",
  "crates/dtoken-config",
  "crates/dtoken-router",
  "crates/dtoken-compress",
  "crates/dtoken-process",
  "crates/dtoken-doctor",
  "crates/dtoken-event-ledger",
  "crates/dtoken-preprocessor",
  "crates/dtoken-headroom-adapter",
  "crates/dtoken-project-policy",
  "crates/dtoken-config-patcher",
  "crates/dtoken-core-api",
  "crates/dtoken-proxy",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/37chengshan/d-token"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
