<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 圆角方框背景 -->
  <rect x="10" y="10" width="180" height="180" rx="28" ry="28" fill="#ffffff" stroke="#e6e6e6" stroke-width="1.5"/>

  <!-- 尾巴 -->
  <path d="M 60 130 Q 35 120 45 90 Q 52 65 70 75 Q 62 100 65 130 Z"
        fill="#f29a4a" stroke="#1f1f1f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 53 88 Q 50 96 52 102" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- 身体 -->
  <path d="M 80 165 Q 70 130 95 115 L 145 115 Q 165 125 160 165 Z"
        fill="#f29a4a" stroke="#1f1f1f" stroke-width="3" stroke-linejoin="round"/>

  <!-- 头 -->
  <ellipse cx="120" cy="80" rx="50" ry="46" fill="#f29a4a" stroke="#1f1f1f" stroke-width="3"/>

  <!-- 脸部白色 -->
  <path d="M 98 80 Q 102 100 120 105 Q 138 100 142 80 Q 138 70 120 68 Q 102 70 98 80 Z"
        fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 左耳 -->
  <path d="M 82 52 L 92 18 L 112 44 Z" fill="#f29a4a" stroke="#1f1f1f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 93 40 L 98 26 L 105 40 Z" fill="#ffc6b3"/>

  <!-- 右耳 -->
  <path d="M 158 52 L 148 18 L 128 44 Z" fill="#f29a4a" stroke="#1f1f1f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 147 40 L 142 26 L 135 40 Z" fill="#ffc6b3"/>

  <!-- 头顶M纹 -->
  <path d="M 100 40 L 112 52 L 120 44 L 128 52 L 140 40"
        fill="none" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 左眼 -->
  <ellipse cx="108" cy="82" rx="5" ry="6.5" fill="#1f1f1f"/>
  <circle cx="109.5" cy="80" r="1.6" fill="#ffffff"/>

  <!-- 右眼 -->
  <ellipse cx="132" cy="82" rx="5" ry="6.5" fill="#1f1f1f"/>
  <circle cx="133.5" cy="80" r="1.6" fill="#ffffff"/>

  <!-- 鼻子 -->
  <path d="M 117 92 L 123 92 L 120 95 Z" fill="#1f1f1f"/>

  <!-- 嘴 -->
  <path d="M 120 95 Q 116 99 113 96" fill="none" stroke="#1f1f1f" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 120 95 Q 124 99 127 96" fill="none" stroke="#1f1f1f" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 腮红 -->
  <ellipse cx="100" cy="95" rx="5" ry="2.5" fill="#ffb59a" opacity="0.7"/>
  <ellipse cx="140" cy="95" rx="5" ry="2.5" fill="#ffb59a" opacity="0.7"/>

  <!-- 笑容大嘴 -->
  <path d="M 110 100 Q 120 110 130 100" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round"/>

  <!-- 网络节点图 -->
  <!-- 连线 -->
  <line x1="55" y1="80" x2="100" y2="120" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="65" y2="155" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="130" y2="155" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="130" y1="155" x2="155" y2="135" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 中心节点（爪子按住） -->
  <circle cx="100" cy="120" r="11" fill="#f29a4a" stroke="#1f1f1f" stroke-width="3"/>
  <circle cx="100" cy="120" r="5" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>

  <!-- 左上节点 -->
  <circle cx="55" cy="80" r="8" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
  <circle cx="55" cy="80" r="3.5" fill="#f29a4a"/>

  <!-- 左下节点 -->
  <circle cx="65" cy="155" r="7" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
  <circle cx="65" cy="155" r="3" fill="#f29a4a"/>

  <!-- 右下节点 -->
  <circle cx="130" cy="155" r="7" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
  <circle cx="130" cy="155" r="3" fill="#f29a4a"/>

  <!-- 右上节点 -->
  <circle cx="155" cy="135" r="7" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
  <circle cx="155" cy="135" r="3" fill="#f29a4a"/>

  <!-- 爪子（中心节点上） -->
  <path d="M 92 110 Q 100 105 108 110 Q 110 118 100 120 Q 90 118 92 110 Z"
        fill="#ffffff" stroke="#1f1f1f" stroke-width="3" stroke-linejoin="round"/>
</svg>
