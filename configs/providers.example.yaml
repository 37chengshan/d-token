# d-token provider and route example
# Copy to providers.local.yaml and fill local secrets through env vars or OS keychain.

providers:
  - id: anthropic-official
    name: Anthropic Official
    kind: anthropic_official
    protocol: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    timeout_ms: 120000
    healthcheck_path: /v1/messages

  - id: openai-official
    name: OpenAI Official
    kind: openai_official
    protocol: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout_ms: 120000
    healthcheck_path: /models

  - id: custom-anthropic-relay
    name: Custom Anthropic-compatible Relay
    kind: custom_anthropic
    protocol: anthropic
    base_url: http://127.0.0.1:19001
    api_key_env: CUSTOM_ANTHROPIC_API_KEY
    timeout_ms: 120000
    healthcheck_path: /v1/messages

  - id: custom-openai-relay
    name: Custom OpenAI-compatible Relay
    kind: custom_openai
    protocol: openai
    base_url: http://127.0.0.1:19002/v1
    api_key_env: CUSTOM_OPENAI_API_KEY
    timeout_ms: 120000
    healthcheck_path: /models

  - id: cc-switch-local
    name: Local cc-switch
    kind: cc_switch
    protocol: openai
    base_url: http://127.0.0.1:19003/v1
    api_key_env: CC_SWITCH_API_KEY
    timeout_ms: 120000
    healthcheck_path: /models

routes:
  - id: claude-official
    name: Claude Code -> d-token -> Anthropic Official
    agent: claude-code
    input_protocol: anthropic
    compression_policy: balanced
    chain: direct
    target_provider_id: anthropic-official
    bind_host: 127.0.0.1
    local_port: 18011

  - id: claude-custom-anthropic
    name: Claude Code -> d-token -> Custom Anthropic
    agent: claude-code
    input_protocol: anthropic
    compression_policy: balanced
    chain: direct
    target_provider_id: custom-anthropic-relay
    bind_host: 127.0.0.1
    local_port: 18012

  - id: codex-official
    name: Codex Official Instance -> d-token -> OpenAI Official
    agent: codex
    input_protocol: openai
    compression_policy: safe
    chain: direct
    target_provider_id: openai-official
    bind_host: 127.0.0.1
    local_port: 18001

  - id: codex-relay
    name: Codex Relay Instance -> d-token -> Custom OpenAI
    agent: codex
    input_protocol: openai
    compression_policy: balanced
    chain: direct
    target_provider_id: custom-openai-relay
    bind_host: 127.0.0.1
    local_port: 18002

  - id: codex-via-cc-switch
    name: Codex Relay Instance -> d-token -> cc-switch -> Provider
    agent: codex
    input_protocol: openai
    compression_policy: balanced
    chain: via_cc_switch
    target_provider_id: cc-switch-local
    bind_host: 127.0.0.1
    local_port: 18003
