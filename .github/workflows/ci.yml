name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/apps/desktop/package-lock.json

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Structure check
        run: python support/scripts/check_structure.py

      - name: Release gate contract
        shell: pwsh
        run: ./support/scripts/run_release_gate_contract_test.ps1

      - name: Release candidate provenance
        shell: pwsh
        run: ./support/scripts/run_release_candidate_provenance_test.ps1

      - name: Install frontend dependencies
        working-directory: code/apps/desktop
        run: npm ci

      - name: Frontend Vitest
        working-directory: code/apps/desktop
        run: npm run test:run

      - name: Frontend TypeScript
        working-directory: code/apps/desktop
        run: npx tsc --noEmit

      - name: Desktop build
        working-directory: code/apps/desktop
        run: npm run build

      - name: Rust formatting
        working-directory: code
        run: cargo fmt --all -- --check

      - name: Prepare Linux d-token runtime sidecar for workspace checks
        run: bash support/scripts/prepare_desktop_sidecar_for_checks.sh

      - name: Rust Clippy
        working-directory: code
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust workspace tests
        working-directory: code
        run: cargo test --workspace

      - name: No-touch fixture smoke
        run: bash support/scripts/run_fixture_tests.sh
