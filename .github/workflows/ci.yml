name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/apps/desktop/package-lock.json

      - name: Structure check
        run: python support/scripts/check_structure.py

      - name: Cargo check
        working-directory: code
        run: cargo check --workspace

      - name: Cargo test
        working-directory: code
        run: cargo test --workspace

      - name: No-touch fixture smoke
        run: bash support/scripts/run_fixture_tests.sh

      - name: Desktop build
        working-directory: code/apps/desktop
        run: |
          npm ci
          npm run build
