name: macos-release

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: code/apps/desktop/package-lock.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Install frontend dependencies
        working-directory: code/apps/desktop
        run: npm ci

      - name: Release gate contract
        shell: pwsh
        run: ./support/scripts/run_release_gate_contract_test.ps1

      - name: Release candidate provenance
        shell: pwsh
        run: ./support/scripts/run_release_candidate_provenance_test.ps1

      - name: Frontend Vitest
        working-directory: code/apps/desktop
        run: npm run test:run

      - name: Frontend TypeScript
        working-directory: code/apps/desktop
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: code/apps/desktop
        run: npm run build

      - name: Rust formatting
        working-directory: code
        run: cargo fmt --all -- --check

      - name: Prepare macOS d-token runtime sidecar for checks
        run: bash support/scripts/prepare_desktop_sidecars_macos.sh --debug

      - name: Rust Clippy
        working-directory: code
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust workspace tests
        working-directory: code
        run: cargo test --workspace

      - name: Prepare release macOS d-token runtime sidecar
        run: bash support/scripts/prepare_desktop_sidecars_macos.sh --release

      - name: Record release candidate provenance
        shell: pwsh
        run: |
          . ./support/scripts/release_candidate_provenance.ps1
          Write-ReleaseCandidateStamp -Root . -Path code/target/release/d-token-release-candidate.json | Out-Null

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/d-token-apple-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/d-token-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' 'NF >= 3 { print $2; exit }')"
          test -n "$SIGNING_IDENTITY"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build macOS Tauri bundle
        working-directory: code/apps/desktop
        env:
          DTOKEN_EXPECTED_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri:with-sidecar -- build --bundles app,dmg

      - name: Verify signed app bundle
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="$(find code/target/release/bundle/macos -name '*.app' -print -quit)"
          BRIDGE_BINARY="$(find code/target/release/bundle/macos -path '*/Contents/MacOS/dtoken-agent-bridge' -print -quit)"
          CODEBASE_MEMORY_LAUNCHER="$(find code/target/release/bundle/macos -path '*/Contents/MacOS/dtoken-codebase-memory-launcher' -print -quit)"
          test -n "$APP_PATH"
          test -n "$BRIDGE_BINARY"
          test -n "$CODEBASE_MEMORY_LAUNCHER"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$BRIDGE_BINARY"
          codesign --verify --strict --verbose=2 "$CODEBASE_MEMORY_LAUNCHER"
          codesign -dv --verbose=4 "$BRIDGE_BINARY" 2>&1 | grep -Fx "TeamIdentifier=${APPLE_TEAM_ID}"
          codesign -dv --verbose=4 "$CODEBASE_MEMORY_LAUNCHER" 2>&1 | grep -Fx "TeamIdentifier=${APPLE_TEAM_ID}"
          BRIDGE_IDENTITY="$RUNNER_TEMP/dtoken-agent-bridge-identity.json"
          "$BRIDGE_BINARY" identity > "$BRIDGE_IDENTITY"
          python3 - "$BRIDGE_IDENTITY" <<'PY'
          import json
          import pathlib
          import sys

          identity = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert identity["component"] == "dtoken-agent-bridge"
          assert identity["protocol_version"] == 1
          assert identity["os"] == "macos"
          assert identity["arch"] in {"aarch64", "x86_64"}
          assert isinstance(identity["version"], str) and identity["version"]
          PY
          "$CODEBASE_MEMORY_LAUNCHER" identity | python3 -c 'import json,sys; identity=json.load(sys.stdin); assert identity["component"] == "dtoken-codebase-memory-launcher"; assert identity["protocol_version"] == 1'

      - name: Notarize macOS DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          DMG_PATH="$(find code/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Verify notarization and Gatekeeper
        run: |
          APP_PATH="$(find code/target/release/bundle/macos -name '*.app' -print -quit)"
          DMG_PATH="$(find code/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Write SHA-256 manifest
        run: |
          APP_BINARY="$(find code/target/release/bundle/macos -path '*/Contents/MacOS/d-token-desktop' -print -quit)"
          SIDECAR_BINARY="$(find code/target/release/bundle/macos -path '*/Contents/MacOS/dtoken-proxy' -print -quit)"
          BRIDGE_BINARY="$(find code/target/release/bundle/macos -path '*/Contents/MacOS/dtoken-agent-bridge' -print -quit)"
          CODEBASE_MEMORY_LAUNCHER="$(find code/target/release/bundle/macos -path '*/Contents/MacOS/dtoken-codebase-memory-launcher' -print -quit)"
          DMG_PATH="$(find code/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$APP_BINARY"
          test -n "$SIDECAR_BINARY"
          test -n "$BRIDGE_BINARY"
          test -n "$CODEBASE_MEMORY_LAUNCHER"
          test -n "$DMG_PATH"
          shasum -a 256 "$APP_BINARY" "$SIDECAR_BINARY" "$BRIDGE_BINARY" "$CODEBASE_MEMORY_LAUNCHER" "$DMG_PATH" > code/target/release/SHA256SUMS-macos.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d-token-macos
          if-no-files-found: error
          path: |
            code/target/release/bundle/dmg/*.dmg
            code/target/release/d-token-release-candidate.json
            code/target/release/SHA256SUMS-macos.txt
