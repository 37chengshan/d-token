name: macos-unsigned-technical-preview

on:
  workflow_call:
    inputs:
      artifact_suffix:
        description: Optional suffix for the uploaded artifact name.
        required: false
        type: string
        default: ""
      release_tag:
        description: Optional release tag to verify with check_release_version.py.
        required: false
        type: string
        default: ""
    outputs:
      artifact_name:
        description: Uploaded macOS artifact bundle name.
        value: ${{ jobs.build-unsigned-arm64-technical-preview.outputs.artifact_name }}
  workflow_dispatch:
    inputs:
      artifact_suffix:
        description: Optional suffix for the uploaded artifact name.
        required: false
        type: string
        default: ""
      release_tag:
        description: Optional release tag to verify with check_release_version.py.
        required: false
        type: string
        default: ""

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-unsigned-arm64-technical-preview:
    runs-on: macos-14
    outputs:
      artifact_name: ${{ steps.resolve_artifact.outputs.artifact_name }}
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve artifact names
        id: resolve_artifact
        shell: bash
        env:
          INPUT_ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}
        run: |
          set -euo pipefail
          suffix="${INPUT_ARTIFACT_SUFFIX:-}"
          if [[ -z "$suffix" ]]; then
            suffix="${GITHUB_REF_NAME:-manual-$GITHUB_RUN_ID}"
          fi
          safe_suffix="$(printf '%s' "$suffix" | tr -cs 'A-Za-z0-9._-' '-')"
          artifact_name="d-token-macos-arm64-unsigned-technical-preview-${safe_suffix}"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: code/apps/desktop/package-lock.json

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Verify repository structure and release scope
        run: |
          python3 support/scripts/check_structure.py
          python3 support/scripts/check_release_scope.py

      - name: Verify release version and tag
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_RELEASE_TAG:-}" ]]; then
            python3 support/scripts/check_release_version.py --tag "$INPUT_RELEASE_TAG"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            python3 support/scripts/check_release_version.py --tag "$GITHUB_REF_NAME"
          else
            python3 support/scripts/check_release_version.py
          fi

      - name: Install frontend dependencies
        working-directory: code/apps/desktop
        run: npm ci

      - name: Install Playwright browsers
        working-directory: code/apps/desktop
        run: npx playwright install chromium webkit

      - name: Release gate contract
        shell: pwsh
        run: ./support/scripts/run_release_gate_contract_test.ps1

      - name: Release candidate provenance
        shell: pwsh
        run: ./support/scripts/run_release_candidate_provenance_test.ps1

      - name: Frontend Vitest
        working-directory: code/apps/desktop
        run: npm run test:run

      - name: Frontend TypeScript
        working-directory: code/apps/desktop
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: code/apps/desktop
        run: npm run build

      - name: Frontend E2E
        working-directory: code/apps/desktop
        run: npm run test:e2e

      - name: Rust formatting
        working-directory: code
        run: cargo fmt --all -- --check

      - name: Prepare macOS d-token runtime sidecar for checks
        run: bash support/scripts/prepare_desktop_sidecars_macos.sh --debug

      - name: Rust Clippy
        working-directory: code
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust workspace tests
        working-directory: code
        run: cargo test --workspace

      - name: Generate SBOM, license inventory, security report and release notes
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          args=(
            --output-dir code/target/release/metadata
            --require-cargo-audit
            --fail-on-high
            --source-revision "$GITHUB_SHA"
          )
          if [[ -n "${INPUT_RELEASE_TAG:-}" ]]; then
            args+=(--tag "$INPUT_RELEASE_TAG")
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          python3 support/scripts/generate_release_metadata.py "${args[@]}"

      - name: Prepare release macOS d-token runtime sidecar
        run: bash support/scripts/prepare_desktop_sidecars_macos.sh --release

      - name: Record release candidate provenance
        shell: pwsh
        run: |
          . ./support/scripts/release_candidate_provenance.ps1
          Write-ReleaseCandidateStamp -Root . -Path code/target/release/d-token-release-candidate.json | Out-Null

      - name: Production codec candidate evidence
        shell: pwsh
        run: ./support/scripts/run_codec_candidate_evidence.ps1

      - name: Candidate capability registry and Headroom coverage
        shell: pwsh
        run: |
          $candidate = Get-Content -LiteralPath "code/target/release/d-token-release-candidate.json" -Raw | ConvertFrom-Json
          $metadata = "code/target/release/metadata"
          $registry = Join-Path $metadata "candidate-capability-registry.json"
          $snapshot = Join-Path $metadata "headroom-capability-snapshot.json"
          ./support/scripts/run_candidate_capability_registry_snapshot.ps1 `
            -CandidateId $candidate.candidate_id `
            -OutputDir $metadata `
            -RegistryPath $registry
          python3 support/scripts/generate_headroom_capability_snapshot.py `
            --registry $registry `
            --candidate-id $candidate.candidate_id `
            --output $snapshot
          ./support/scripts/run_headroom_capability_coverage_audit.ps1 `
            -CapabilitySnapshot $snapshot `
            -ExpectedCandidateId $candidate.candidate_id `
            -OutputDir $metadata

      - name: Release performance and stability gate
        shell: pwsh
        run: ./support/scripts/run_release_performance_gate.ps1

      - name: Build unsigned macOS ARM64 technical-preview bundle
        working-directory: code/apps/desktop
        run: |
          npm run tauri:with-sidecar -- build --target aarch64-apple-darwin --bundles app,dmg
          test -n "$(find ../../target/aarch64-apple-darwin/release/bundle/dmg -name '*_aarch64.dmg' -print -quit)"

      - name: Audit unsigned ARM64 installation, startup, uninstall and bundle contents
        run: |
          bash support/scripts/run_macos_release_package_audit.sh \
            --dmg "$(find code/target/aarch64-apple-darwin/release/bundle/dmg -name '*_aarch64.dmg' -print -quit)" \
            --report code/target/aarch64-apple-darwin/release/macos-arm64-unsigned-technical-preview-package-audit.md
          printf '%s\n' 'PUBLIC UNSIGNED PRERELEASE: GitHub public prerelease artifact only. Not Developer ID signed, notarized, Gatekeeper-approved, or production certified.' > code/target/aarch64-apple-darwin/release/UNSIGNED-TECHNICAL-PREVIEW.txt

      - name: Ensure redaction audit inputs exist
        shell: bash
        run: |
          set -euo pipefail
          # Fresh macOS runners do not have support/artifacts yet, and the
          # redaction audit's Resolve-Path fails when an AdditionalPath is
          # missing.  Create it unconditionally so the audit sees an empty
          # directory instead of throwing on a missing path.
          mkdir -p support/artifacts
          test -f code/target/release/d-token-release-candidate.json

      - name: Audit release cleanup and metadata redaction
        shell: pwsh
        run: |
          ./support/scripts/run_release_cleanup_audit.ps1 -OutputDir code/target/release/metadata
          ./support/scripts/run_release_artifact_redaction_audit.ps1 `
            -OutputDir code/target/release/metadata `
            -AdditionalPath @("code/target/release/d-token-release-candidate.json", "support/artifacts") `
            -All

      - name: Write SHA-256 manifest
        run: |
          set -euo pipefail
          TARGET=code/target/aarch64-apple-darwin/release
          APP_BINARY="$(find "$TARGET/bundle/macos" -path '*/Contents/MacOS/d-token-desktop' -print -quit)"
          SIDECAR_BINARY="$(find "$TARGET/bundle/macos" -path '*/Contents/MacOS/dtoken-proxy' -print -quit)"
          BRIDGE_BINARY="$(find "$TARGET/bundle/macos" -path '*/Contents/MacOS/dtoken-agent-bridge' -print -quit)"
          CODEBASE_MEMORY_LAUNCHER="$(find "$TARGET/bundle/macos" -path '*/Contents/MacOS/dtoken-codebase-memory-launcher' -print -quit)"
          DMG_PATH="$(find "$TARGET/bundle/dmg" -name '*_aarch64.dmg' -print -quit)"
          METADATA_ARTIFACTS=()
          while IFS= read -r -d '' artifact; do
            METADATA_ARTIFACTS+=("$artifact")
          done < <(find code/target/release/metadata -type f -print0)
          test -n "$APP_BINARY"
          test -n "$SIDECAR_BINARY"
          test -n "$BRIDGE_BINARY"
          test -n "$CODEBASE_MEMORY_LAUNCHER"
          test -n "$DMG_PATH"
          test "${#METADATA_ARTIFACTS[@]}" -gt 0
          shasum -a 256 \
            "$APP_BINARY" \
            "$SIDECAR_BINARY" \
            "$BRIDGE_BINARY" \
            "$CODEBASE_MEMORY_LAUNCHER" \
            "$DMG_PATH" \
            code/target/release/d-token-release-candidate.json \
            "$TARGET/macos-arm64-unsigned-technical-preview-package-audit.md" \
            "$TARGET/UNSIGNED-TECHNICAL-PREVIEW.txt" \
            "${METADATA_ARTIFACTS[@]}" \
            > "$TARGET/SHA256SUMS-macos-arm64-unsigned-technical-preview.txt"

      - name: Upload verified macOS candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve_artifact.outputs.artifact_name }}
          if-no-files-found: error
          path: |
            code/target/aarch64-apple-darwin/release/bundle/dmg/*_aarch64.dmg
            code/target/release/d-token-release-candidate.json
            code/target/aarch64-apple-darwin/release/macos-arm64-unsigned-technical-preview-package-audit.md
            code/target/aarch64-apple-darwin/release/SHA256SUMS-macos-arm64-unsigned-technical-preview.txt
            code/target/aarch64-apple-darwin/release/UNSIGNED-TECHNICAL-PREVIEW.txt
            code/target/release/metadata/*

      # PR-7 evidence wiring (upload only): fan any evidence produced on this
      # runner into the publish job so the fan-in job can aggregate it.
      # Pure wiring — an empty evidence dir must never fail the build
      # (if-no-files-found: warn); the fan-in artifact contract is the hard
      # gate and the full fail-closed aggregation runs as N9 on Main.
      - name: Upload local evidence artifacts (fan-in wiring)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve_artifact.outputs.artifact_name }}-evidence
          if-no-files-found: warn
          path: |
            support/artifacts/**/*.json
