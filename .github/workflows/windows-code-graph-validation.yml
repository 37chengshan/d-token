name: windows-code-graph-validation

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate branch or commit to validate
        required: true
        default: codex/code-graph-mcp-integration
        type: string

permissions:
  contents: read

jobs:
  validate-installed-code-graph:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: code/apps/desktop/package-lock.json

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Install frontend dependencies
        working-directory: code/apps/desktop
        run: npm ci

      - name: Validate repository and release contracts
        shell: pwsh
        run: |
          python support/scripts/check_structure.py
          python -m unittest discover -s support/tests -p "test_*.py"
          ./support/scripts/run_release_gate_contract_test.ps1
          ./support/scripts/run_release_candidate_provenance_test.ps1

      - name: Validate shared desktop UI
        working-directory: code/apps/desktop
        run: |
          npm run test:run
          npx tsc --noEmit
          npm run build

      - name: Prepare Windows sidecars
        shell: pwsh
        run: ./support/scripts/prepare_desktop_sidecars.ps1

      - name: Validate Rust workspace
        working-directory: code
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build unsigned Windows validation installer
        working-directory: code/apps/desktop
        shell: pwsh
        run: npm run tauri:with-sidecar -- build

      - name: Audit validation bundle
        shell: pwsh
        run: |
          ./support/scripts/run_desktop_packaging_audit.ps1
          ./support/scripts/run_desktop_bundle_artifact_audit.ps1
          ./support/scripts/run_release_distribution_audit.ps1

      - name: Install and launch current candidate
        shell: pwsh
        run: ./support/scripts/run_installed_desktop_startup_audit.ps1 -SilentInstallLatest

      - name: Prepare pinned user-imported Code Graph component
        shell: pwsh
        run: |
          $importDir = Join-Path $env:LOCALAPPDATA "d-token\codebase-memory\upstream"
          New-Item -ItemType Directory -Force -Path $importDir | Out-Null
          python support/scripts/prepare_codebase_memory_artifact.py `
            --manifest code/runtimes/codebase-memory/artifact-manifest.json `
            --target x86_64-pc-windows-msvc `
            --artifact-dir code/target/codebase-memory-validation-artifacts `
            --binary-output (Join-Path $importDir "codebase-memory-mcp.exe") `
            --license-output (Join-Path $importDir "LICENSE") `
            --notices-output (Join-Path $importDir "THIRD_PARTY_NOTICES.md") `
            --download --require-attestation

      - name: Exercise installed MCP index and graph surface
        shell: pwsh
        # This is an unsigned validation-only installer. The smoke script still
        # requires the installed launcher hash to exactly match this candidate.
        run: ./support/scripts/run_installed_codebase_memory_smoke.ps1 -OpenBrowser -AllowUnsignedValidationLauncher

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-code-graph-validation
          if-no-files-found: warn
          path: |
            support/artifacts/*.json
            code/target/release/d-token-release-candidate.json
            code/target/release/bundle/nsis/*.exe

      - name: Uninstall validation candidate
        if: always()
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:LOCALAPPDATA "d-token/uninstall.exe"
          if (Test-Path -LiteralPath $uninstaller) {
            $process = Start-Process -FilePath $uninstaller -ArgumentList @("/S") -PassThru -Wait
            if ($process.ExitCode -ne 0) {
              throw "Silent uninstall failed with exit code $($process.ExitCode)."
            }
          }
