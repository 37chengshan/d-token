<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">d-token observability and code intelligence</title>
  <desc id="desc">A dark analytics promotional banner showing request metrics, Event Ledger, Doctor status, code graph and evidence-based token accounting.</desc>
  <defs>
