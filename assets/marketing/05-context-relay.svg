<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">d-token context relay across agents (v0.3 roadmap)</title>
  <desc id="desc">A dark promotional banner showing the planned cross-agent context relay: two AI coding agents reuse verified project context through d-token, marked as a v0.3 roadmap capability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.5" stop-color="#172033"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#cbd5e1" stroke-opacity="0.045"/>
    </pattern>
    <marker id="arrowDim" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="940" rx="780" ry="300" fill="#0284c7" opacity="0.06"/>

  <g transform="translate(82 68)">
    <rect width="58" height="58" rx="17" fill="url(#orange)"/>
    <text x="29" y="40" text-anchor="middle" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800">d</text>
    <text x="76" y="39" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="780">d-token</text>
  </g>

  <g transform="translate(82 178)">
    <text x="0" y="0" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="820" letter-spacing="-2">One project. Many agents. Shared context.</text>
    <text x="0" y="56" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">跨 Agent 上下文复用：复用已验证内容，避免重复读取、重复解析与重复传输</text>
  </g>

  <!-- Left: agents -->
  <g transform="translate(100 330)">
    <g filter="url(#shadow)">
      <rect width="300" height="330" rx="28" fill="#1e293b" stroke="#334155" stroke-opacity="0.8"/>
      <text x="28" y="46" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="750" letter-spacing="1.2">AI CODING AGENTS</text>
      <g transform="translate(24 70)">
        <rect width="252" height="62" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09"/>
        <circle cx="30" cy="31" r="12" fill="#10b981"/>
        <text x="54" y="37" fill="#f1f5f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">OpenCode</text>
      </g>
      <g transform="translate(24 146)">
        <rect width="252" height="62" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09"/>
        <circle cx="30" cy="31" r="12" fill="#e2e8f0"/>
        <text x="54" y="37" fill="#f1f5f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">Claude Code</text>
      </g>
      <g transform="translate(24 222)">
        <rect width="252" height="62" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09"/>
        <circle cx="30" cy="31" r="12" fill="#2563eb"/>
        <text x="54" y="37" fill="#f1f5f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">Codex</text>
      </g>
    </g>

    <!-- Dashed relay paths: planned, from agent card edge (local x=300) to relay card left edge (local x=434) -->
    <path d="M300 190 H434" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowDim)"/>
    <path d="M300 260 H434" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowDim)"/>
    <text x="367" y="172" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">relay hit</text>
    <text x="367" y="292" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">relay hit</text>
  </g>

  <!-- Center: d-token relay -->
  <g transform="translate(534 300)" filter="url(#shadow)">
    <rect width="520" height="390" rx="34" fill="#0f172a" stroke="#1e293b"/>
    <g transform="translate(28 26)">
      <rect width="60" height="60" rx="18" fill="url(#orange)"/>
      <text x="30" y="41" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800">d</text>
      <text x="82" y="27" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="760">Context Relay</text>
      <text x="82" y="51" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Planned for v0.3 · cross-agent reuse</text>
    </g>

    <g transform="translate(28 116)">
      <rect width="464" height="62" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="32" cy="31" r="13" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8"/>
      <path d="M24 31H40M32 23V39" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <text x="58" y="27" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="680">Content hash check</text>
      <text x="58" y="47" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">File changed? The old relay entry stops matching</text>
    </g>
    <g transform="translate(28 192)">
      <rect width="464" height="62" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="32" cy="31" r="13" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa"/>
      <path d="M24 31H40M32 23V39" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
      <text x="58" y="27" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="680">Project &amp; user isolation</text>
      <text x="58" y="47" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">No cross-project, no cross-user context</text>
    </g>
    <g transform="translate(28 268)">
      <rect width="464" height="62" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="32" cy="31" r="13" fill="#fb923c" fill-opacity="0.18" stroke="#fb923c"/>
      <path d="M26 34L32 40L43 25" fill="none" stroke="#fb923c" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="27" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="680">Recovery Pointer</text>
      <text x="58" y="47" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Always a stable way back to full content</text>
    </g>
    <!-- Relay → shared cache: planned store path -->
    <path d="M520 195 H574" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowDim)"/>
    <text x="547" y="178" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">store</text>
  </g>

  <!-- Right: shared cache -->
  <g transform="translate(1108 330)" filter="url(#shadow)">
    <rect width="392" height="330" rx="28" fill="#1e293b" stroke="#334155" stroke-opacity="0.8"/>
    <text x="28" y="46" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="750" letter-spacing="1.2">SHARED PROJECT CONTEXT</text>
    <g transform="translate(24 72)">
      <rect width="344" height="52" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="26" cy="26" r="6" fill="#22c55e"/>
      <text x="46" y="32" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">file hashes</text>
    </g>
    <g transform="translate(24 136)">
      <rect width="344" height="52" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="26" cy="26" r="6" fill="#38bdf8"/>
      <text x="46" y="32" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">signatures</text>
    </g>
    <g transform="translate(24 200)">
      <rect width="344" height="52" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="26" cy="26" r="6" fill="#a78bfa"/>
      <text x="46" y="32" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">code map</text>
    </g>
    <g transform="translate(24 264)">
      <rect width="344" height="52" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="26" cy="26" r="6" fill="#fb923c"/>
      <text x="46" y="32" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">redacted summaries</text>
    </g>
  </g>

  <!-- Planned badge -->
  <g transform="translate(82 726)">
    <rect width="1456" height="64" rx="20" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="12 8"/>
    <circle cx="40" cy="32" r="9" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <path d="M34 32H46M40 26V38" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <text x="66" y="40" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Context Relay is a planned v0.3 capability.</text>
    <text x="500" y="40" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">The current candidate does not yet reuse context across agents.</text>
  </g>
</svg>
