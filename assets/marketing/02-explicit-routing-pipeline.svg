  <g transform="translate(72 790)">
    <rect width="1456" height="64" rx="20" fill="#0f172a"/>
    <text x="30" y="41" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Every request produces redacted evidence:</text>
    <text x="360" y="41" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19">route · provider · model · transforms · latency · outcome · Event Ledger</text>
  </g>
