<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">d-token explicit routing pipeline</title>
  <desc id="desc">A light technical promotional diagram showing AI coding agents flowing through d-token local runtime, context optimization and explicit routes to configured upstreams.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#94a3b8"/>
    </marker>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#94a3b8" opacity="0.17"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <g transform="translate(88 72)">
    <rect width="58" height="58" rx="17" fill="url(#orange)"/>
    <text x="29" y="39" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="33" font-weight="800">d</text>
    <text x="76" y="39" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="780">d-token</text>
  </g>

  <g transform="translate(88 178)">
    <text x="0" y="0" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="820" letter-spacing="-2">One local path. Every route explained.</text>
    <text x="0" y="56" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">从 AI Coding Agent 到模型上游，连接路径始终显式、可观测、无静默 fallback</text>
  </g>

  <g transform="translate(72 348)">
    <g filter="url(#cardShadow)">
      <rect width="260" height="390" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="28" y="48" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="750" letter-spacing="1.2">AI CODING AGENTS</text>
      <g transform="translate(24 82)">
        <rect width="212" height="58" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="29" cy="29" r="12" fill="#111827"/>
        <text x="55" y="36" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">Claude Code</text>
      </g>
      <g transform="translate(24 154)">
        <rect width="212" height="58" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="29" cy="29" r="12" fill="#10b981"/>
        <text x="55" y="36" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">OpenCode</text>
      </g>
      <g transform="translate(24 226)">
        <rect width="212" height="58" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="29" cy="29" r="12" fill="#2563eb"/>
        <text x="55" y="36" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">Codex</text>
      </g>
      <g transform="translate(24 298)">
        <rect width="212" height="58" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
        <g fill="#64748b">
          <circle cx="22" cy="29" r="4"/><circle cx="35" cy="29" r="4"/><circle cx="48" cy="29" r="4"/>
        </g>
        <text x="66" y="36" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="620">More agents</text>
      </g>
    </g>

    <path d="M278 195H394" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="336" y="173" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">loopback</text>
    <text x="336" y="220" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">127.0.0.1</text>

    <g transform="translate(414 -34)" filter="url(#cardShadow)">
      <rect width="480" height="458" rx="34" fill="#111827" stroke="#1e293b"/>
      <g transform="translate(30 28)">
        <rect width="60" height="60" rx="18" fill="url(#orange)"/>
        <text x="30" y="41" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800">d</text>
        <text x="82" y="27" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="760">Local Rust runtime</text>
        <text x="82" y="51" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Owned by d-token · no external dashboard dependency</text>
      </g>

      <g transform="translate(30 118)">
        <rect width="420" height="66" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
        <circle cx="34" cy="33" r="13" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8"/>
        <path d="M28 33H40M34 27V39" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
        <text x="60" y="29" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="680">Protocol guard</text>
        <text x="60" y="49" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">OpenAI Chat · Responses · Anthropic Messages</text>
      </g>
      <g transform="translate(30 198)">
        <rect width="420" height="66" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
        <circle cx="34" cy="33" r="13" fill="#fb923c" fill-opacity="0.18" stroke="#fb923c"/>
        <path d="M26 36L32 42L43 25" fill="none" stroke="#fb923c" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="60" y="29" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="680">Context optimization</text>
        <text x="60" y="49" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Safe codecs · protected tail · fail-closed validation</text>
      </g>
      <g transform="translate(30 278)">
        <rect width="420" height="66" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
        <circle cx="34" cy="33" r="13" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa"/>
        <path d="M26 28H42M26 38H38" stroke="#a78bfa" stroke-width="2.7" stroke-linecap="round"/>
        <text x="60" y="29" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="680">Explicit route decision</text>
        <text x="60" y="49" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Provider · model · protocol · project scope</text>
      </g>
      <g transform="translate(30 372)">
        <circle cx="8" cy="8" r="8" fill="#22c55e"/>
        <text x="26" y="14" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">No silent provider fallback</text>
        <circle cx="238" cy="8" r="8" fill="#22c55e"/>
        <text x="256" y="14" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Correlated request ID</text>
      </g>
    </g>

    <path d="M912 195H1028" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="970" y="173" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">explicit route</text>

    <g transform="translate(1048 0)" filter="url(#cardShadow)">
      <rect width="408" height="390" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="28" y="48" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="750" letter-spacing="1.2">CONFIGURED UPSTREAMS</text>
      <g transform="translate(24 82)">
        <rect width="360" height="74" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
        <circle cx="34" cy="37" r="15" fill="url(#blue)"/>
        <text x="62" y="33" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="680">Official providers</text>
        <text x="62" y="54" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Anthropic · OpenAI-compatible</text>
      </g>
      <g transform="translate(24 174)">
        <rect width="360" height="74" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
        <circle cx="34" cy="37" r="15" fill="url(#orange)"/>
        <text x="62" y="33" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="680">Custom / relay</text>
        <text x="62" y="54" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Explicit URL and protocol</text>
      </g>
      <g transform="translate(24 266)">
        <rect width="360" height="74" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
        <circle cx="34" cy="37" r="15" fill="#10b981"/>
        <text x="62" y="33" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="680">cc-switch / local</text>
        <text x="62" y="54" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Read-only discovery · controlled sync</text>
      </g>
