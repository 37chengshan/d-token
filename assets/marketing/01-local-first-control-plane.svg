          <path d="M0 96 C42 88 46 53 86 66 S145 103 181 63 S245 29 286 48 S360 72 428 17 L428 116 L0 116Z" fill="#fb923c" fill-opacity="0.10"/>
          <line x1="0" y1="116" x2="428" y2="116" stroke="#64748b" stroke-opacity="0.34"/>
