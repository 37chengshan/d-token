        <rect width="464" height="112" rx="18" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.08"/>
        <circle cx="28" cy="33" r="8" fill="#22c55e"/>
        <text x="48" y="40" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">OpenCode → d-token → upstream</text>
